name: LimpiaPC (Windows)

on:
  push:
    paths:
      - "pc-cleaner/**"
      - ".github/workflows/limpiapc-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pc-cleaner
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas del motor
        env:
          # %TEMP% está dentro de AppData, que el organizador (con razón) no deja tocar.
          LIMPIAPC_TEST_TMP: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v

      - name: Recorrido completo de la interfaz (datos de prueba aislados)
        run: |
          python -m pip install --quiet pillow
          python tests/ui_smoke.py "${{ runner.temp }}" capturas

      - name: Crear LimpiaPC.exe
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LimpiaPC LimpiaPC.pyw

      - name: Comprobar que LimpiaPC.exe arranca
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LimpiaPC.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "LimpiaPC.exe se cerró al arrancar (código $($p.ExitCode))"; exit 1 }
          Get-Process -Name LimpiaPC -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Output "LimpiaPC.exe arrancó correctamente."

      - name: Subir LimpiaPC.exe
        uses: actions/upload-artifact@v4
        with:
          name: LimpiaPC-Windows
          path: pc-cleaner/dist/LimpiaPC.exe

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-windows
          path: pc-cleaner/capturas
          if-no-files-found: ignore
