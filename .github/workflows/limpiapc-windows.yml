name: LimpiaPC (Windows)

on:
  push:
    paths:
      - "pc-cleaner/**"
      - ".github/workflows/limpiapc-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: pc-cleaner
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas del motor
        env:
          # %TEMP% está dentro de AppData, que el organizador (con razón) no deja tocar.
          LIMPIAPC_TEST_TMP: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v

      - name: Pruebas con las APIs reales de Windows (papelera, registro, carpetas)
        run: python tests/windows_integration.py

      - name: Recorrido completo de la interfaz (datos de prueba aislados)
        run: |
          python -m pip install --quiet pillow
          python tests/ui_smoke.py "${{ runner.temp }}" capturas

      - name: Crear LimpiaPC.exe
        run: |
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LimpiaPC LimpiaPC.pyw

      - name: Autoprueba de LimpiaPC.exe (abre todas las pantallas y se cierra)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\LimpiaPC.exe -ArgumentList "--selftest" -PassThru
          $null = $p.Handle  # necesario para poder leer ExitCode después
          if (-not $p.WaitForExit(180000)) {
            Get-Process -Name LimpiaPC -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Error "LimpiaPC.exe no terminó la autoprueba a tiempo"; exit 1
          }
          Get-Content "$env:TEMP\limpiapc-selftest.log"
          if ($p.ExitCode -ne 0) { Write-Error "La autoprueba de LimpiaPC.exe falló (código $($p.ExitCode))"; exit 1 }
          Write-Output "LimpiaPC.exe abrió todas las pantallas sin errores."

      - name: Subir LimpiaPC.exe
        uses: actions/upload-artifact@v4
        with:
          name: LimpiaPC-Windows
          path: pc-cleaner/dist/LimpiaPC.exe

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-windows
          path: pc-cleaner/capturas
          if-no-files-found: ignore
